name: Build

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

# Pushing again supersedes the run in flight, but a tag build is producing a
# release and has to finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    # Every branch in this repository already builds on push, so the
    # pull_request trigger would only run the same commit twice. It still
    # matters for pull requests opened from a fork, which no push here covers.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests
        run: |
          set -o pipefail
          ./gradlew testDebugUnitTest --stacktrace 2>&1 | tee build.log

      - name: Build debug APK
        run: |
          set -o pipefail
          ./gradlew assembleDebug --stacktrace 2>&1 | tee -a build.log

      - name: Prepare release signing key
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          test -n "$RELEASE_KEYSTORE_BASE64"
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > release-signing.jks
          chmod 600 release-signing.jks

      - name: Build signed release APK
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          RELEASE_KEYSTORE_PATH: ${{ github.workspace }}/release-signing.jks
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          test -n "$RELEASE_STORE_PASSWORD"
          test -n "$RELEASE_KEY_ALIAS"
          test -n "$RELEASE_KEY_PASSWORD"
          ./gradlew assembleRelease --stacktrace 2>&1 | tee -a build.log

      # Downloading run logs needs admin rights on the repository, so put the
      # compiler output where anyone looking at the run can read it.
      - name: Surface build errors
        if: failure()
        run: |
          details=$(grep -E "^e: |FAILURE:|What went wrong|Caused by:|error:|Could not (find|resolve)|FAILED|expected:|tests? completed" build.log | head -40)
          details="${details//'%'/'%25'}"
          details="${details//$'\n'/'%0A'}"
          details="${details//$'\r'/'%0D'}"
          echo "::error::${details}"

      - name: Upload APK
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          apk=$(find app/build -type f -name '*.apk' | grep -E '/release/' | head -n 1)
          test -n "$apk" || { echo 'No release APK produced'; find app/build/outputs -type f | head -50; exit 1; }
          mkdir -p release
          cp "$apk" release/app-release.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ startsWith(github.ref, 'refs/tags/v') && 'app-release' || 'app-debug' }}
          path: ${{ startsWith(github.ref, 'refs/tags/v') && 'release/*.apk' || 'app/build/outputs/apk/debug/app-debug.apk' }}
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.apk
          generate_release_notes: true
