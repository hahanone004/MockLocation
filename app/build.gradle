plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'mock.location'
    compileSdk 36

    defaultConfig {
        applicationId "mock.location"
        minSdk 36
        targetSdk 36
        versionCode 2001
        versionName "2.0.1"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildFeatures {
        viewBinding = true
        buildConfig = true
    }

    // Release signing is supplied by CI secrets. Never commit the keystore or
    // its passwords; a missing value makes an assembleRelease invocation fail
    // instead of silently producing an unsigned APK.
    signingConfigs {
        release {
            storeFile file(System.getenv("RELEASE_KEYSTORE_PATH") ?: "missing-release-keystore.jks")
            storePassword System.getenv("RELEASE_STORE_PASSWORD") ?: "missing"
            keyAlias System.getenv("RELEASE_KEY_ALIAS") ?: "missing"
            keyPassword System.getenv("RELEASE_KEY_PASSWORD") ?: "missing"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    def fragment_version = "1.8.6"

    implementation 'androidx.core:core-ktx:1.16.0'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
    implementation "androidx.fragment:fragment-ktx:$fragment_version"
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'

    implementation 'com.afollestad.material-dialogs:core:3.3.0'
    implementation 'com.afollestad.material-dialogs:bottomsheets:3.3.0'
    implementation 'com.afollestad.material-dialogs:input:3.3.0'
    implementation 'com.drakeet.about:about:2.5.0'

    implementation 'com.github.idanatz:OneAdapter:2.1.6'
    implementation 'io.github.scwang90:refresh-layout-kernel:3.0.0-alpha'
    implementation 'io.github.scwang90:refresh-header-material:3.0.0-alpha'

    implementation 'com.squareup.moshi:moshi:1.15.2'
    implementation 'com.squareup.moshi:moshi-kotlin:1.15.2'

    implementation 'org.lsposed.hiddenapibypass:hiddenapibypass:6.1'
    // EzXHelper replaced by mock.location.xposed.helpers.reflect (see Reflect.kt)
    compileOnly 'de.robv.android.xposed:api:82'
}
